<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gradient Fill Buttons — no pseudo-elements</title>
<style>
  @property --hole {
    syntax: '<length>';
    inherits: false;
    initial-value: 160px;
  }
 
  body {
    background: #0d0b10;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    flex-wrap: wrap;
  }
 
  .grad-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 36px;
    background: transparent;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    isolation: isolate;
  }
 
  /* layer 1: gradient border, real element sitting behind the label */
  .border-layer {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    background: linear-gradient(120deg, #7b5cff, #ff7a5c, #ffb44c);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: 1;
    transition: opacity 0.5s ease;
  }
 
  /* layer 2: fill, masked with a shrinking transparent "hole" at center */
  .fill-layer {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(120deg, #7b5cff, #ff7a5c, #ffb44c);
    -webkit-mask-image: radial-gradient(circle at center, transparent 0, transparent var(--hole), black var(--hole));
    mask-image: radial-gradient(circle at center, transparent 0, transparent var(--hole), black var(--hole));
    transition: --hole 0.6s cubic-bezier(.4,0,.2,1);
    z-index: 0;
  }
 
  /* layer 3: the actual label, always on top */
  .label {
    position: relative;
    z-index: 2;
    font-size: 16px;
    font-weight: 600;
    color: #dfe7ff;
    transition: color 0.4s ease;
    pointer-events: none;
  }
 
  .grad-btn:hover .fill-layer {
    --hole: 0px;
  }
 
  .grad-btn:hover .border-layer {
    opacity: 0;
  }
 
  .grad-btn:hover .label {
    color: #fff;
  }
 
  .grad-btn:active {
    transform: scale(0.97);
  }
</style>
</head>
<body>
 
  <button class="grad-btn">
    <span class="fill-layer"></span>
    <span class="border-layer"></span>
    <span class="label">GitHub</span>
  </button>
 
  <button class="grad-btn">
    <span class="fill-layer"></span>
    <span class="border-layer"></span>
    <span class="label">LinkedIn</span>
  </button>
 
  <button class="grad-btn">
    <span class="fill-layer"></span>
    <span class="border-layer"></span>
    <span class="label">Email</span>
  </button>
 
</body>
</html>
