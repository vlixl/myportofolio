<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Button</title>
    <style>
    :root{
        --gradient: linear-gradient(
                90deg,
                rgba(221, 0, 255, 1),
                rgba(255, 136, 0, 1)
            );
    }
    #btn {
        position: relative;
        isolation: isolate;
        overflow: hidden;

        font-size: 4em;
        margin: 3em auto;

        border: 5px solid transparent;
        border-radius: 999px;

        height: 2em;
        width: 4em;

        text-decoration: none;
        color: black;

        display: flex;
        justify-content: center;
        align-items: center;

        background:
            linear-gradient(white, white) padding-box,
            var(--gradient) border-box;

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    #btn::before {
        content: "";
        position: absolute;
        inset: 0;

        background: var(--gradient);

        opacity: 0;
        transition: opacity 0.35s ease;

        z-index: -1;
    }

    #btn:hover {
        transform: translateY(-8px) scale(1.05);
        box-shadow: 0 12px 25px rgba(221, 0, 255, 0.3);
    }

    #btn:hover::before {
        opacity: 1;
    }

    #btn:active {
        transform: translateY(2px) scale(0.95);
        box-shadow: 0 3px 8px rgba(221, 0, 255, 0.25);
    }
    
    </style>
</head>
<body>
    <a href="#" id="btn">Button</a>
</body>
</html>
