<div id="{{ modal_id }}"
    class="gate-modal"
    popover="auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="{{ modal_id }}-title"
    {% if password_error %}open{% endif %}>
    <button type="button"
            class="gate-modal__backdrop"
            popovertarget="{{ modal_id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi"></button>
    <div class="gate-modal__content">
        <button type="button"
                class="gate-modal__close"
                popovertarget="{{ modal_id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi">×</button>
        <h2 id="{{ modal_id }}-title">{{ title }}</h2>
        <p>{{ message }}</p>

        {% if password_error %}
            <p class="gate-error" role="alert">{{ password_error }}</p>
        {% endif %}

        <div class="gate-field">
            <label for="gate-password-{{ modal_id }}">Password</label>
            <input type="password"
                    id="gate-password-{{ modal_id }}"
                    name="gate_password"
                    form="{{ form_id }}"
                    required
                    autocomplete="off">
        </div>

        <div class="gate-modal__actions">
            <button type="button"
                    class="gate-btn gate-btn-secondary"
                    popovertarget="{{ modal_id }}"
                    popovertargetaction="hide">Batal</button>
            <button type="submit"
                    form="{{ form_id }}"
                    class="gate-btn">{{ confirm_label }}</button>
        </div>
    </div>
</div>
